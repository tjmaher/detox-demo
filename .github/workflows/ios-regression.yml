name: "Build & Test iOS"

permissions:
  contents: write
  packages: read
  id-token: write
  pages: write 
  actions: read 

on:
  # Run all tests when changes are pushed onto the main branch
  push:
    branches: [ main ]
  
  # Run all tests before being merged to main, when branches are opened or synchronized
  pull_request:
    branches: [ main ]

  # Run all tests every day at 10:00 PM EST  # schedule:
  #  - cron: '0 3 * * *'  # 10:00 PM EST = 3:00 AM UTC
  
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select either all or specific test suite to run'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'login.test.ts'
          - 'secure-area.test.ts'          

jobs:
  ios-regression:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $HOME/.zprofile
          eval "$(/opt/homebrew/bin/brew shellenv)"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache Homebrew and RubyGems
        uses: actions/cache@v3
        with:
          path: |
            /opt/homebrew/Cellar
            /opt/homebrew/lib
            ~/.gem
          key: ${{ runner.os }}-homebrew-gems-${{ hashFiles('**/Gemfile.lock', '**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-gems-

      - name: Setup Node.js for React Native & Detox
        uses: actions/setup-node@v4
        with:
          node-version: '20'  
          cache: 'yarn'    

      - name: Clean lock file conflicts
        run: rm -f package-lock.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          gem install cocoapods
          pod install --repo-update

      - name: Install Applesimutils
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew tap wix/brew
          brew install applesimutils

      - name: Build Detox for iOS
        run: yarn detox:build:ios

      - name: Run Detox e2e tests
        run: |
          # Ensure simulator is available
          xcrun simctl list devices available
          
          # Run tests based on selection
          if [ "${{ github.event.inputs.test_suite }}" == "all" ] || [ -z "${{ github.event.inputs.test_suite }}" ]; then
            yarn detox:test:ios --artifacts-location artifacts --record-logs all
          else
            # Run specific test file from e2e directory
            yarn detox test e2e/${{ github.event.inputs.test_suite }} --configuration ios.sim.debug --artifacts-location artifacts --record-logs all
          fi
        env:
          DETOX_CONFIGURATION: ios.sim.debug

      - name: Setup Allure
        if: always()
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install allure

      - name: Generate Allure report from results
        if: always()
        run: |
          # Verify allure-results directory exists
          if [ -d "allure-results" ]; then
            echo "Found allure-results directory with $(ls -la allure-results | wc -l) files"
            ls -la allure-results/
          else
            echo "No allure-results directory found, creating empty one"
            mkdir -p allure-results
          fi
          
          # Generate Allure HTML report
          allure generate allure-results --clean -o allure-report
          
          # Add index.html if missing
          if [ ! -f "allure-report/index.html" ]; then
            echo "<html><body><h1>No Allure results generated</h1><p>Check test execution logs</p></body></html>" > allure-report/index.html
          fi

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-${{ github.run_id }}
          path: |
            artifacts/
            allure-results/
            allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ios
          keep_files: true

      - name: Clean workspace
        if: always()
        run: |
          # Clean up Detox artifacts
          rm -rf ~/Library/Developer/Xcode/DerivedData
          # Clean up simulator data if needed
          xcrun simctl shutdown all
          xcrun simctl erase all
          # Clean yarn cache
          yarn cache clean
          # Clean temporary files
          rm -rf /tmp/detox*