name: "Build & Test iOS"

# Permissions scoped per job for security
permissions: {}

# Global configuration constants
env:
  # Application Configuration
  APP_NAME: 'DetoxDemo'
  WORKSPACE_NAME: 'DetoxDemo'
  SCHEME_NAME: 'DetoxDemo'
  
  # Timeouts (in seconds)
  METRO_STARTUP_TIMEOUT: 60
  METRO_HEALTHCHECK_TIMEOUT: 120
  BUNDLE_GENERATION_TIMEOUT: 180
  SIMULATOR_BOOT_TIMEOUT: 30
  
  # Artifact Retention
  BUILD_ARTIFACT_RETENTION_DAYS: 1
  TEST_ARTIFACT_RETENTION_DAYS: 7
  REPORT_ARTIFACT_RETENTION_DAYS: 30
  
  # Default Test Artifact Capture Settings
  DEFAULT_LOG_LEVEL: 'info'
  DEFAULT_CAPTURE_LOGS: 'failing'
  DEFAULT_CAPTURE_SCREENSHOTS: 'all'
  DEFAULT_CAPTURE_VIDEO: 'failing'
  DEFAULT_RECORD_PERFORMANCE: 'none'
  
  # Node/Metro Configuration
  NODE_VERSION: '20'
  METRO_PORT: 8081

on:
  # Run all tests when changes are pushed to main branch
  push:
    branches: [ main ]
  
  # Run all tests on PRs targeting main
  pull_request:
    branches: [ main ]

  # Nightly automated test runs at 10:00 PM EST (3:00 AM UTC)
  # Uncomment to enable scheduled runs
  # schedule:
  #   - cron: '0 3 * * *'
  
  # Manual workflow trigger with full configuration options
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select either all or specific test suite to run'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'login.test.ts'
          - 'secure-area.test.ts'
      
      device:
        description: 'Select iOS device to run tests on'
        required: true
        type: choice
        default: 'iPhone 16 Pro'
        options:
          - 'iPhone 16'
          - 'iPhone 16 Pro'
          - 'iPhone 16 Pro Max'
          - 'iPad mini (6th generation)'
          - 'iPad Air (5th generation)'
          - 'iPad Pro (12.9-inch) (6th generation)'
    jobs:
      build:
        runs-on: macos-latest
        outputs:
          app-path: ${{ steps.build.outputs.app-path }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v3
          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: 18
          - name: Install dependencies
            run: yarn install --frozen-lockfile
          - name: Install CocoaPods
            run: sudo gem install cocoapods
          - name: Install pods
            run: cd ios && pod install
          - name: Build iOS app
            id: build
            run: |
              xcodebuild -workspace ios/DetoxDemo.xcworkspace -scheme DetoxDemo -configuration Release -sdk iphonesimulator -derivedDataPath ios/build
              echo "::set-output name=app-path::ios/build/Build/Products/Release-iphonesimulator/DetoxDemo.app"
          - name: Upload app artifact
            uses: actions/upload-artifact@v3
            with:
              name: DetoxDemo.app
              path: ios/build/Build/Products/Release-iphonesimulator/DetoxDemo.app
      test:
        needs: build
        runs-on: macos-latest
        steps:
          - name: Download app artifact
            uses: actions/download-artifact@v3
            with:
              name: DetoxDemo.app
          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: 18
          - name: Install dependencies
            run: yarn install --frozen-lockfile
          - name: Run Detox tests
            run: yarn detox:test:ios
        options:
          - 'all'
          - 'failing'
          - 'none'
      
      capture_video:
        description: 'Capture video?'
        required: true
        type: choice
        default: 'failing'
        options:
          - 'none'
          - 'failing'
          - 'all'
      
      record_performance:
        description: 'Detox Instruments performance? (iOS only)'
        required: true
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'all'

jobs:
    # Simple build step for iOS app before Detox tests
    build-simple:
      name: Build iOS App (Simple)
      runs-on: macos-14
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Build iOS app
          run: |
            cd ios
            xcodebuild \
              -workspace DetoxDemo.xcworkspace \
              -scheme DetoxDemo \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build
  # =============================================================================
  # Stage 0: Input Validation
  # =============================================================================
  
validate-inputs:
    name: Validate Workflow Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    
    steps:
      - name: Validate inputs
        run: |
          echo "=== Validating Workflow Inputs ==="
          
          # Validate OS version format (should be X.Y or X.Y.Z)
          OS_VERSION="${{ github.event.inputs.os_version || '18.2' }}"
          if [[ ! "$OS_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ Invalid OS version format: $OS_VERSION"
            echo "   Expected format: X.Y or X.Y.Z (e.g., 18.2 or 17.0.1)"
            exit 1
          fi
          
          # Sanitize device name (remove any potentially dangerous characters)
          DEVICE_RAW="${{ github.event.inputs.device || 'iPhone 16 Pro' }}"
          DEVICE_SAFE=$(echo "$DEVICE_RAW" | tr -cd '[:alnum:] ().-')
          if [ "$DEVICE_RAW" != "$DEVICE_SAFE" ]; then
            echo "⚠️  Device name contains invalid characters"
            echo "   Original: $DEVICE_RAW"
            echo "   Sanitized: $DEVICE_SAFE"
          fi
          
          # Sanitize test suite name
          TEST_SUITE_RAW="${{ github.event.inputs.test_suite || 'all' }}"
          TEST_SUITE_SAFE=$(echo "$TEST_SUITE_RAW" | tr -cd '[:alnum:].-')
          if [ "$TEST_SUITE_RAW" != "$TEST_SUITE_SAFE" ]; then
            echo "⚠️  Test suite name contains invalid characters"
            echo "   Original: $TEST_SUITE_RAW"
            echo "   Sanitized: $TEST_SUITE_SAFE"
          fi
          
          echo "✅ All inputs validated successfully"
          echo "   Device: $DEVICE_SAFE"
          echo "   iOS Version: $OS_VERSION"
          echo "   Test Suite: $TEST_SUITE_SAFE"

  # =============================================================================
  # Stage 1: Build iOS Application
  # =============================================================================
  
build:
    name: Build iOS App
    runs-on: macos-14
    needs: validate-inputs
    if: always() && needs.validate-inputs.result == 'success'
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      build-success: ${{ steps.build-app.outcome }}
      build-path: ${{ steps.build-app.outputs.build_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode version
        id: select-xcode
        run: |
          echo "=== Selecting Xcode Version ==="
          echo "Available Xcode installations:"
          ls /Applications/ | grep Xcode || echo "No Xcode installations found"
          
          # Try to select Xcode 16.x for iPhone 16 simulator support
          XCODE_SELECTED=false
          
          for XCODE_VERSION in 16.2 16.1 16.0; do
            XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            if [ -d "$XCODE_PATH" ]; then
              echo "Found Xcode $XCODE_VERSION, selecting..."
              sudo xcode-select -s "$XCODE_PATH"
              XCODE_SELECTED=true
              break
            fi
          done
          
          # Fallback to default Xcode if no specific version found
          if [ "$XCODE_SELECTED" = false ]; then
            if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
              echo "Using default Xcode installation..."
              sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
              XCODE_SELECTED=true
            fi
          fi
          
          # Verify Xcode was selected
          if [ "$XCODE_SELECTED" = false ]; then
            echo "❌ ERROR: No compatible Xcode installation found"
            echo "Required: Xcode 16.x or later for iPhone 16 simulator support"
            exit 1
          fi
          
          echo "✅ Selected Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/applesimutils
            /opt/homebrew/lib/applesimutils
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install JavaScript dependencies
        run: |
          echo "=== Installing JavaScript Dependencies ==="
          # Remove any conflicting lock files
          rm -f package-lock.json
          
          # Install with frozen lockfile for reproducibility
          yarn install --frozen-lockfile
          
          echo "✅ JavaScript dependencies installed"

      - name: Install CocoaPods dependencies
        run: |
          echo "=== Installing CocoaPods Dependencies ==="
          cd ios
          
          # Ensure CocoaPods is installed
          gem install cocoapods --no-document
          
          # Install pods with repo update
          pod install --repo-update
          
          echo "✅ CocoaPods dependencies installed"

      - name: Install Applesimutils
        run: |
          echo "=== Installing Applesimutils ==="
          
          # Check if already installed
          if command -v applesimutils &> /dev/null; then
            echo "✅ Applesimutils already installed"
            applesimutils --version
            exit 0
          fi
          
          # Install via Homebrew
          brew tap wix/brew
          brew install applesimutils
          
          echo "✅ Applesimutils installed"
          applesimutils --version

      - name: List available simulators
        run: |
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available --json | jq -r '
            .devices | 
            to_entries[] | 
            select(.key | contains("iOS")) | 
            .value[] | 
            "\(.name) - \(.udid) (iOS \(
              (.key | capture("iOS (?<version>[0-9.]+)").version) // "unknown"
            ))"
          ' || xcrun simctl list devices available | grep "iPhone\|iPad"
          
          echo ""
          echo "=== Available iOS Runtimes ==="
          xcrun simctl list runtimes

      - name: Build iOS app
        id: build-app
        run: |
          echo "=== Building iOS Application ==="
          
          # Set build configuration
          DEVICE_NAME="${{ github.event.inputs.device || 'iPhone 16 Pro' }}"
          OS_VERSION="${{ github.event.inputs.os_version || '18.2' }}"
          
          echo "Build Configuration:"
          echo "  App: ${{ env.APP_NAME }}"
          echo "  Workspace: ${{ env.WORKSPACE_NAME }}"
          echo "  Scheme: ${{ env.SCHEME_NAME }}"
          echo "  Device: $DEVICE_NAME"
          echo "  iOS Version: $OS_VERSION"
          echo ""
          
          # Build the iOS app
          cd ios
          xcodebuild \
            -workspace "${{ env.WORKSPACE_NAME }}.xcworkspace" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME,OS=$OS_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee build.log
          
          BUILD_EXIT_CODE=${PIPEFAIL[0]}
          cd ..
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code $BUILD_EXIT_CODE"
            echo "Check build.log for details"
            exit $BUILD_EXIT_CODE
          fi
          
          # Verify build output
          BUILD_PATH="ios/build/Build/Products/Debug-iphonesimulator/${{ env.APP_NAME }}.app"
          if [ ! -d "$BUILD_PATH" ]; then
            echo "❌ ERROR: Build artifact not found at $BUILD_PATH"
            exit 1
          fi
          
          echo "✅ Build completed successfully"
          echo "build_path=$BUILD_PATH" >> $GITHUB_OUTPUT
          
          # Display build artifact info
          ls -lh "$BUILD_PATH/" | head -20
        env:
          CI: true
          NODE_ENV: development

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_id }}
          path: |
            ios/build/Build/Products/Debug-iphonesimulator/
            node_modules/.bin/detox
          retention-days: ${{ env.BUILD_ARTIFACT_RETENTION_DAYS }}
          compression-level: 6

  # =============================================================================
  # Stage 2: Run E2E Tests
  # =============================================================================
test:
    name: Run E2E Tests
    runs-on: macos-14
    needs: build
    if: needs.build.outputs.build-success == 'success'
    timeout-minutes: 45
    permissions:
      contents: read
    
    outputs:
      test-outcome: ${{ steps.run-tests.outcome }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode version
        run: |
          echo "=== Selecting Xcode Version ==="
          # Must match build job Xcode version
          XCODE_SELECTED=false
          
          for XCODE_VERSION in 16.2 16.1 16.0; do
            XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            if [ -d "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH"
              XCODE_SELECTED=true
              break
            fi
          done
          
          if [ "$XCODE_SELECTED" = false ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          
          echo "✅ Selected Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build-${{ github.run_id }}
          path: ios/build/Build/Products/Debug-iphonesimulator/

      - name: Verify build artifacts
        run: |
          echo "=== Verifying Build Artifacts ==="
          
          APP_PATH="ios/build/Build/Products/Debug-iphonesimulator/${{ env.APP_NAME }}.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ ERROR: App bundle not found at $APP_PATH"
            echo "Available files:"
            ls -la ios/build/Build/Products/Debug-iphonesimulator/ || echo "Directory not found"
            exit 1
          fi
          
          echo "✅ App bundle verified: $APP_PATH"
          echo "App bundle contents:"
          ls -lh "$APP_PATH/" | head -10
          
          # Verify app binary exists
          if [ ! -f "$APP_PATH/${{ env.APP_NAME }}" ]; then
            echo "❌ ERROR: App binary not found in bundle"
            exit 1
          fi
          
          echo "✅ App binary verified"

      - name: Install Applesimutils
        run: |
          if ! command -v applesimutils &> /dev/null; then
            brew tap wix/brew
            brew install applesimutils
          fi
          applesimutils --version

      - name: Find and boot simulator
        id: boot-simulator
        run: |
          echo "=== Finding and Booting Simulator ==="
          
          DEVICE_NAME="${{ github.event.inputs.device || 'iPhone 16 Pro' }}"
          OS_VERSION="${{ github.event.inputs.os_version || '18.2' }}"
          
          echo "Target device: $DEVICE_NAME (iOS $OS_VERSION)"
          
          # Use JSON output for robust parsing
          SIMULATOR_DATA=$(xcrun simctl list devices -j)
          
          # Find matching simulator
          SIMULATOR_ID=$(echo "$SIMULATOR_DATA" | jq -r --arg name "$DEVICE_NAME" '
            .devices | 
            to_entries[] | 
            select(.key | contains("iOS")) |
            .value[] | 
            select(.name == $name and .isAvailable == true) | 
            .udid
          ' | head -1)
          
          if [ -z "$SIMULATOR_ID" ]; then
            echo "❌ ERROR: Could not find simulator matching '$DEVICE_NAME'"
            echo "Available simulators:"
            echo "$SIMULATOR_DATA" | jq -r '.devices | to_entries[] | .value[] | "\(.name) - \(.udid)"'
            exit 1
          fi
          
          echo "✅ Found simulator: $SIMULATOR_ID"
          echo "simulator_id=$SIMULATOR_ID" >> $GITHUB_OUTPUT
          
          # Check if already booted
          STATE=$(xcrun simctl list devices -j | jq -r --arg id "$SIMULATOR_ID" '
            .devices[][] | select(.udid == $id) | .state
          ')
          
          if [ "$STATE" = "Booted" ]; then
            echo "ℹ️  Simulator already booted"
          else
            echo "Booting simulator..."
            xcrun simctl boot "$SIMULATOR_ID"
            
            # Wait for boot to complete with timeout
            BOOT_TIMEOUT=${{ env.SIMULATOR_BOOT_TIMEOUT }}
            ELAPSED=0
            
            while [ $ELAPSED -lt $BOOT_TIMEOUT ]; do
              if xcrun simctl bootstatus "$SIMULATOR_ID" 2>&1 | grep -q "Device already booted"; then
                echo "✅ Simulator booted successfully"
                break
              fi
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            done
            
            if [ $ELAPSED -ge $BOOT_TIMEOUT ]; then
              echo "⚠️  Boot verification timeout, continuing anyway..."
            fi
          fi
          
          # Display simulator info
          xcrun simctl list devices -j | jq -r --arg id "$SIMULATOR_ID" '
            .devices[][] | select(.udid == $id)
          '

      - name: Start Metro bundler
        id: start-metro
        run: |
          echo "=== Starting Metro Bundler ==="
          
          # Start Metro in background with logging
          yarn start --reset-cache > metro.log 2>&1 &
          METRO_PID=$!
          
          echo "Metro PID: $METRO_PID"
          echo "metro_pid=$METRO_PID" >> $GITHUB_OUTPUT
          
          # Setup cleanup trap
          trap "echo 'Cleaning up Metro...'; kill $METRO_PID 2>/dev/null || true" EXIT
          
          # Wait for Metro to be ready with exponential backoff
          echo "Waiting for Metro to start..."
          TIMEOUT=${{ env.METRO_STARTUP_TIMEOUT }}
          ELAPSED=0
          RETRY_DELAY=2
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl -sf --max-time 5 "http://localhost:${{ env.METRO_PORT }}/status" | grep -q "packager-status:running"; then
              echo "✅ Metro is running"
              break
            fi
            
            echo "Waiting for Metro... (${ELAPSED}s/${TIMEOUT}s)"
            sleep $RETRY_DELAY
            ELAPSED=$((ELAPSED + RETRY_DELAY))
            
            # Exponential backoff
            if [ $RETRY_DELAY -lt 10 ]; then
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ ERROR: Metro failed to start within ${TIMEOUT}s"
            echo "Metro log:"
            cat metro.log
            exit 1
          fi
          
          echo "✅ Metro bundler ready"

      - name: Pre-generate JavaScript bundle
        run: |
          echo "=== Pre-generating JavaScript Bundle ==="
          
          # This prevents test timeout by ensuring bundle is ready before tests start
          BUNDLE_START=$(date +%s)
          BUNDLE_TIMEOUT=${{ env.BUNDLE_GENERATION_TIMEOUT }}
          
          echo "Generating bundle (timeout: ${BUNDLE_TIMEOUT}s)..."
          
          if curl -sf \
            --max-time $BUNDLE_TIMEOUT \
            "http://localhost:${{ env.METRO_PORT }}/index.bundle?platform=ios&dev=true&minify=false" \
            -o /tmp/bundle.js; then
            
            BUNDLE_END=$(date +%s)
            BUNDLE_TIME=$((BUNDLE_END - BUNDLE_START))
            BUNDLE_SIZE=$(wc -c < /tmp/bundle.js | tr -d ' ')
            BUNDLE_SIZE_MB=$(echo "scale=2; $BUNDLE_SIZE / 1048576" | bc)
            
            echo "✅ Bundle generated successfully"
            echo "   Time: ${BUNDLE_TIME}s"
            echo "   Size: ${BUNDLE_SIZE_MB}MB"
            
            rm /tmp/bundle.js
          else
            echo "❌ ERROR: Bundle generation failed or timed out"
            echo "Metro may not be responding correctly"
            exit 1
          fi
          
          # Verify bundle is cached and available
          echo "Verifying bundle cache..."
          if curl -sf --max-time 10 \
            "http://localhost:${{ env.METRO_PORT }}/index.bundle?platform=ios&dev=true&minify=false" \
            | head -c 100 | grep -q "sourceMappingURL"; then
            echo "✅ Bundle is cached and ready"
          else
            echo "⚠️  Bundle verification failed, tests may be slower"
          fi

      - name: Run Detox E2E tests
        id: run-tests
        run: |
          echo "=== Running Detox E2E Tests ==="
          
          # Create artifact directories
          mkdir -p allure-results artifacts
          
          # Get test configuration from inputs or defaults
          DEVICE_NAME="${{ github.event.inputs.device || 'iPhone 16 Pro' }}"
          TEST_SUITE="${{ github.event.inputs.test_suite || 'all' }}"
          LOG_LEVEL="${{ github.event.inputs.logger_level || env.DEFAULT_LOG_LEVEL }}"
          CAPTURE_LOGS="${{ github.event.inputs.capture_logs || env.DEFAULT_CAPTURE_LOGS }}"
          CAPTURE_SCREENSHOTS="${{ github.event.inputs.capture_screenshots || env.DEFAULT_CAPTURE_SCREENSHOTS }}"
          CAPTURE_VIDEO="${{ github.event.inputs.capture_video || env.DEFAULT_CAPTURE_VIDEO }}"
          RECORD_PERFORMANCE="${{ github.event.inputs.record_performance || env.DEFAULT_RECORD_PERFORMANCE }}"
          
          echo "Test Configuration:"
          echo "  Device: $DEVICE_NAME"
          echo "  iOS Version: $OS_VERSION"
          echo "  Test Suite: $TEST_SUITE"
          echo "  Log Level: $LOG_LEVEL"
          echo "  Capture Logs: $CAPTURE_LOGS"
          echo "  Capture Screenshots: $CAPTURE_SCREENSHOTS"
          echo "  Capture Video: $CAPTURE_VIDEO"
          echo "  Record Performance: $RECORD_PERFORMANCE"
          echo ""
          
          # Build detox command
          DETOX_CMD="yarn detox test"
          
          # Add test suite if specified
          if [ "$TEST_SUITE" != "all" ]; then
            DETOX_CMD="$DETOX_CMD e2e/$TEST_SUITE"
          fi
          
          # Add configuration and options
          DETOX_CMD="$DETOX_CMD \
            --configuration ios.sim.debug \
            --loglevel $LOG_LEVEL \
            --artifacts-location artifacts \
            --record-logs $CAPTURE_LOGS \
            --take-screenshots $CAPTURE_SCREENSHOTS \
            --record-videos $CAPTURE_VIDEO \
            --record-performance $RECORD_PERFORMANCE"
          
          echo "Running command: $DETOX_CMD"
          echo ""
          
          # Run tests and capture exit code
          set +e
          eval $DETOX_CMD
          TEST_EXIT_CODE=$?
          set -e
          
          # Report results
          echo ""
          echo "=== Test Execution Complete ==="
          
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✅ All tests passed"
          else
            echo "❌ Tests failed with exit code $TEST_EXIT_CODE"
          fi
          
          # Verify test results were generated
          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results/*.json 2>/dev/null)" ]; then
            RESULT_COUNT=$(find allure-results -name "*.json" -type f | wc -l | tr -d ' ')
            echo "Generated $RESULT_COUNT Allure result files"
          else
            echo "⚠️  No Allure results generated"
          fi
          
          exit $TEST_EXIT_CODE
        env:
          DETOX_ENABLE_ALLURE: 'true'
          DETOX_CONFIGURATION: ios.sim.debug
          CI: true
          RCT_METRO_PORT: ${{ env.METRO_PORT }}

      - name: Stop Metro bundler
        if: always()
        run: |
          echo "=== Stopping Metro Bundler ==="
          METRO_PID="${{ steps.start-metro.outputs.metro_pid }}"
          
          if [ -n "$METRO_PID" ]; then
            kill $METRO_PID 2>/dev/null || true
            echo "✅ Metro bundler stopped"
          else
            echo "ℹ️  No Metro PID found"
          fi
          
          # Also kill any orphaned Metro processes
          pkill -f "react-native.*start" || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-test-results-${{ github.run_id }}
          path: |
            artifacts/
            allure-results/
          retention-days: ${{ env.TEST_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  # =============================================================================
  # Stage 3: Generate and Publish Allure Report
  # =============================================================================
publish-allure-report:
    name: Publish Test Report
    runs-on: macos-14
    needs: [build, test]
    if: always() && needs.build.outputs.build-success == 'success'
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: detox-test-results-${{ github.run_id }}
          path: .
        continue-on-error: true

      - name: Verify test artifacts
        id: verify-artifacts
        run: |
          echo "=== Verifying Test Artifacts ==="
          
          HAS_RESULTS=false
          
          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results/*.json 2>/dev/null)" ]; then
            RESULT_COUNT=$(find allure-results -name "*.json" -type f | wc -l | tr -d ' ')
            echo "✅ Found $RESULT_COUNT Allure result files"
            HAS_RESULTS=true
          else
            echo "⚠️  No Allure results found"
            echo "Creating minimal result set for empty report..."
            mkdir -p allure-results
          fi
          
          echo "has_results=$HAS_RESULTS" >> $GITHUB_OUTPUT
          
          if [ -d "artifacts" ]; then
            echo "✅ Found artifacts directory"
            ARTIFACT_SIZE=$(du -sh artifacts/ 2>/dev/null | cut -f1 || echo '0')
            echo "   Total size: $ARTIFACT_SIZE"
          else
            echo "ℹ️  No artifacts directory (expected if tests passed with 'failing' capture mode)"
          fi

      - name: Checkout GitHub Pages for history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Copy Allure history
        if: always()
        continue-on-error: true
        run: |
          echo "=== Copying Allure History ==="
          
          if [ -d "gh-pages-history/ios/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-history/ios/history/* allure-results/history/
            
            HISTORY_FILES=$(ls -1 allure-results/history/ | wc -l | tr -d ' ')
            echo "✅ Copied $HISTORY_FILES history files"
          else
            echo "ℹ️  No previous history found (first run)"
          fi

      - name: Install Allure
        run: |
          echo "=== Installing Allure ==="
          brew install allure
          allure --version

      - name: Attach Detox artifacts to Allure
        if: always()
        run: |
          echo "=== Attaching Artifacts to Allure Report ==="
          
          if [ ! -d "artifacts" ]; then
            echo "ℹ️  No artifacts to attach"
            exit 0
          fi
          
          mkdir -p allure-results/attachments
          
          FOUND_ANY=false
          
          # Attach screenshots
          if find artifacts -name "*.png" -type f 2>/dev/null | grep -q .; then
            echo "📸 Attaching screenshots..."
            find artifacts -name "*.png" -type f -exec cp {} allure-results/attachments/ \;
            COUNT=$(find allure-results/attachments -name "*.png" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "   ✅ Attached $COUNT screenshots"
            FOUND_ANY=true
          fi
          
          # Attach videos
          if find artifacts -name "*.mp4" -type f 2>/dev/null | grep -q .; then
            echo "🎥 Attaching videos..."
            find artifacts -name "*.mp4" -type f -exec cp {} allure-results/attachments/ \;
            COUNT=$(find allure-results/attachments -name "*.mp4" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "   ✅ Attached $COUNT videos"
            FOUND_ANY=true
          fi
          
          # Attach logs
          if find artifacts -name "*.log" -type f 2>/dev/null | grep -q .; then
            echo "📋 Attaching logs..."
            find artifacts -name "*.log" -type f -exec cp {} allure-results/attachments/ \;
            COUNT=$(find allure-results/attachments -name "*.log" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "   ✅ Attached $COUNT log files"
            FOUND_ANY=true
          fi
          
          # Attach performance traces (iOS only)
          if find artifacts -name "*.trace" -type f 2>/dev/null | grep -q .; then
            echo "📊 Attaching performance traces..."
            find artifacts -name "*.trace" -type f -exec cp {} allure-results/attachments/ \;
            COUNT=$(find allure-results/attachments -name "*.trace" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "   ✅ Attached $COUNT performance traces"
            FOUND_ANY=true
          fi
          
          if [ "$FOUND_ANY" = false ]; then
            echo "ℹ️  No artifacts captured (normal when tests pass with 'failing' mode)"
          else
            TOTAL_SIZE=$(du -sh allure-results/attachments/ 2>/dev/null | cut -f1 || echo '0')
            echo "Total attachments size: $TOTAL_SIZE"
          fi

      - name: Generate Allure metadata
        if: always()
        run: |
          echo "=== Generating Allure Metadata ==="
          
          mkdir -p allure-results
          
          # Executor information
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "iOS Detox Tests #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ios/",
            "reportName": "Allure Report"
          }
          EOF
          
          # Environment properties
          # Sanitize commit message for properties file
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 | tr '\n' ' ' | sed 's/[^a-zA-Z0-9 ._-]/_/g')
          
          cat > allure-results/environment.properties << EOF
          # Test Environment
          Platform=iOS
          Device=${{ github.event.inputs.device || 'iPhone 16 Pro' }}
          iOS.Version=${{ github.event.inputs.os_version || '18.2' }}
          Test.Suite=${{ github.event.inputs.test_suite || 'all' }}
          
          # Framework Versions
          Node.Version=$(node --version)
          Yarn.Version=$(yarn --version)
          Detox.Version=$(yarn list --pattern detox --depth=0 2>/dev/null | grep detox@ | sed 's/.*detox@//' || echo 'unknown')
          React.Native.Version=$(node -p "require('./package.json').dependencies['react-native']" 2>/dev/null || echo 'unknown')
          
          # Test Configuration
          Log.Level=${{ github.event.inputs.logger_level || env.DEFAULT_LOG_LEVEL }}
          Capture.Logs=${{ github.event.inputs.capture_logs || env.DEFAULT_CAPTURE_LOGS }}
          Capture.Screenshots=${{ github.event.inputs.capture_screenshots || env.DEFAULT_CAPTURE_SCREENSHOTS }}
          Capture.Video=${{ github.event.inputs.capture_video || env.DEFAULT_CAPTURE_VIDEO }}
          Record.Performance=${{ github.event.inputs.record_performance || env.DEFAULT_RECORD_PERFORMANCE }}
          
          # CI/CD Information
          Branch=${{ github.ref_name }}
          Commit.SHA=${{ github.sha }}
          Commit.Author=${{ github.actor }}
          Commit.Message=$COMMIT_MSG
          Repository=${{ github.repository }}
          Workflow.Run.ID=${{ github.run_id }}
          Workflow.Run.Number=${{ github.run_number }}
          Workflow.Attempt=${{ github.run_attempt }}
          Trigger=${{ github.event_name }}
          Run.Date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          # Test categories for better failure classification
          cat > allure-results/categories.json << 'EOF'
          [
            {
              "name": "Login & Authentication Failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*login.*|.*auth.*|.*credential.*"
            },
            {
              "name": "Timeout Issues",
              "matchedStatuses": ["failed", "broken"],
              "messageRegex": ".*timeout.*|.*timed out.*"
            },
            {
              "name": "Element Not Found",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*not found.*|.*unable to find.*|.*does not exist.*"
            },
            {
              "name": "Network & API Failures",
              "matchedStatuses": ["failed", "broken"],
              "messageRegex": ".*network.*|.*api.*|.*request.*|.*response.*"
            },
            {
              "name": "Infrastructure Issues",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*simulator.*|.*build.*|.*metro.*|.*bundler.*"
            },
            {
              "name": "Test Framework Issues",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*detox.*|.*jest.*|.*test.*setup.*"
            }
          ]
          EOF
          
          echo "✅ Metadata generated"

      - name: Generate Allure report
        run: |
          echo "=== Generating Allure Report ==="
          
          # Generate report with history
          allure generate allure-results --clean -o allure-report
          
          echo "✅ Allure report generated"
          
          # Verify history inclusion
          if [ -d "allure-report/history" ]; then
            HISTORY_FILES=$(ls -1 allure-report/history/ | wc -l | tr -d ' ')
            echo "✅ History included: $HISTORY_FILES files"
          else
            echo "ℹ️  No history in report (first run)"
          fi
          
          # Display report size
          REPORT_SIZE=$(du -sh allure-report/ | cut -f1)
          echo "Report size: $REPORT_SIZE"

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/
          retention-days: ${{ env.REPORT_ARTIFACT_RETENTION_DAYS }}

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ios
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Allure report for run #${{ github.run_number }}'

      - name: Report publishing status
        if: always()
        run: |
          echo "=== Report Publishing Summary ==="
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ios/"
            echo "✅ Report published to GitHub Pages"
            echo "🔗 URL: $REPORT_URL"
          else
            echo "ℹ️  Report not published (not main branch)"
            echo "   Download artifact to view report locally"
          fi

  # =============================================================================
  # Stage 4: Cleanup and Summary
  # =============================================================================
cleanup:
    name: Cleanup & Summary
    runs-on: macos-14
    needs: [build, test, publish-allure-report]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    
    steps:
      - name: Cleanup workspace
        run: |
          echo "=== Cleaning Up Workspace ==="
          
          # Remove temporary Detox files
          rm -rf /tmp/detox* 2>/dev/null || true
          
          # Kill any orphaned processes
          pkill -f "react-native.*start" 2>/dev/null || true
          pkill -f "Metro" 2>/dev/null || true
          
          echo "✅ Workspace cleaned"

      - name: Workflow summary
        if: always()
        run: |
          echo "=== Workflow Execution Summary ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build status
          if [ "${{ needs.build.outputs.build-success }}" = "success" ]; then
            echo "✅ **Build:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Test status
          if [ "${{ needs.test.outputs.test-outcome }}" = "success" ]; then
            echo "✅ **Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.outputs.test-outcome }}" = "failure" ]; then
            echo "❌ **Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Tests:** ${{ needs.test.outputs.test-outcome }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Report status
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ios/"
            echo "📊 **Report:** [View Allure Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "📊 **Report:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Device: ${{ github.event.inputs.device || 'iPhone 16 Pro' }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Version: ${{ github.event.inputs.os_version || '18.2' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Suite: ${{ github.event.inputs.test_suite || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: #${{ github.run_number }} (Attempt ${{ github.run_attempt }})" >> $GITHUB_STEP_SUMMARY