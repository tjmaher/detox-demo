name: "Build & Test iOS"

permissions:
  contents: write
  packages: read
  id-token: write
  pages: write 
  actions: read 

on:
  # Run all tests when changes are pushed onto the main branch
  push:
    branches: [ main ]
  
  # Run all tests before being merged to main, when branches are opened or synchronized
  # pull_request:
  #   branches: [ main ]

  # Run all tests every day at 10:00 PM EST  # schedule:
  #  - cron: '0 3 * * *'  # 10:00 PM EST = 3:00 AM UTC
  
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select either all or specific test suite to run'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'login.test.ts'
          - 'secure-area.test.ts'

jobs:
  # Setup and Build
  build:
    runs-on: macos-latest
    outputs:
      build-success: ${{ steps.build-app.outcome }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $HOME/.zprofile
          eval "$(/opt/homebrew/bin/brew shellenv)"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache Homebrew and RubyGems
        uses: actions/cache@v3
        with:
          path: |
            /opt/homebrew/Cellar
            /opt/homebrew/lib
            ~/.gem
          key: ${{ runner.os }}-homebrew-gems-${{ hashFiles('**/Gemfile.lock', '**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-gems-

      - name: Setup Node.js for React Native & Detox
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Clean lock file conflicts
        run: rm -f package-lock.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          gem install cocoapods
          pod install --repo-update

      - name: Install Applesimutils
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew tap wix/brew
          brew install applesimutils

      - name: Build Detox for iOS
        id: build-app
        run: |
          echo "Building React Native app for Detox testing..."
          
          # Start Metro bundler in background for CI
          echo "Starting Metro bundler for CI build..."
          yarn start --reset-cache &
          METRO_PID=$!
          
          # Wait for Metro to start
          echo "Waiting for Metro bundler to start..."
          sleep 15
          
          # Build the iOS app with embedded bundle
          echo "Building iOS app with embedded JS bundle..."
          cd ios
          xcodebuild \
            -workspace DetoxDemo.xcworkspace \
            -scheme DetoxDemo \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          
          cd ..
          
          # Stop Metro bundler
          echo "Stopping Metro bundler..."
          kill $METRO_PID || true
          
          echo "Build completed successfully"
        env:
          CI: true
          NODE_ENV: development

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_id }}
          path: |
            ios/build/
            node_modules/.bin/detox
          retention-days: 1

  # Stage 2: Run Tests, if build succeeds)
  test:
    runs-on: macos-latest
    needs: build
    if: needs.build.outputs.build-success == 'success'
    outputs:
      test-results: ${{ steps.run-tests.outcome }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build-${{ github.run_id }}

      - name: Install Applesimutils
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew tap wix/brew
          brew install applesimutils

      - name: Run Detox e2e tests
        id: run-tests
        continue-on-error: true
        run: |
          # Create directories explicitly
          mkdir -p allure-results
          mkdir -p artifacts
          
          # Start Metro bundler for tests
          echo "Starting Metro bundler for test execution..."
          yarn start --reset-cache &
          METRO_PID=$!
          
          # Wait for Metro to be ready
          echo "Waiting for Metro bundler to start..."
          sleep 15
          
          # List available simulators
          echo "Available iOS simulators:"
          xcrun simctl list devices available
          
          # Find and boot iPhone 16 Pro simulator explicitly
          echo "Looking for iPhone 16 Pro simulator..."
          SIMULATOR_ID=$(xcrun simctl list devices | grep "iPhone 16 Pro" | grep -v "Max" | head -1 | grep -o '[A-Z0-9-]\{36\}')
          
          if [ ! -z "$SIMULATOR_ID" ]; then
            echo "Found iPhone 16 Pro simulator: $SIMULATOR_ID"
            echo "Booting iPhone 16 Pro..."
            xcrun simctl boot "$SIMULATOR_ID" || echo "Simulator already booted"
            
            # Wait for simulator to fully boot
            echo "Waiting for simulator to boot completely..."
            sleep 10
            
            # Verify simulator is booted
            xcrun simctl list devices | grep "$SIMULATOR_ID"
          else
            echo "ERROR: iPhone 16 Pro simulator not found!"
            echo "Available iPhone simulators:"
            xcrun simctl list devices | grep "iPhone"
            kill $METRO_PID || true
            exit 1
          fi
          
          echo "Starting Detox tests on iPhone 16 Pro with Metro running..."
          
          # Run Detox tests with explicit Allure environment variables
          if [ "${{ github.event.inputs.test_suite }}" == "all" ] || [ -z "${{ github.event.inputs.test_suite }}" ]; then
            echo "Running all Detox tests..."
            JEST_ALLURE2_REPORTER_RESULTS_DIR=allure-results yarn detox:test:ios --artifacts-location artifacts --record-logs all || echo "Tests completed with failures"
          else
            echo "Running specific test: ${{ github.event.inputs.test_suite }}"
            JEST_ALLURE2_REPORTER_RESULTS_DIR=allure-results yarn detox test e2e/${{ github.event.inputs.test_suite }} --configuration ios.sim.debug --artifacts-location artifacts --record-logs all || echo "Tests completed with failures"
          fi
          
          # Check if allure-results has content
          echo "Checking allure-results directory..."
          ls -la allure-results/ || echo "allure-results is empty"
          find allure-results -type f -name "*.json" -print0 | xargs -0 wc -l || echo "Failed to count JSON files in allure-results"
          
          # Stop Metro bundler after tests
          echo "Stopping Metro bundler..."
          kill $METRO_PID || true
          
          echo "Detox tests completed on iPhone 16 Pro"
        env:
          DETOX_CONFIGURATION: ios.sim.debug
          CI: true
          RCT_METRO_PORT: 8081
          JEST_ALLURE2_REPORTER_RESULTS_DIR: allure-results

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-test-results-${{ github.run_id }}
          path: |
            artifacts/
            allure-results/
          retention-days: 7

  # Stage 3: Generate Allure Reports, only if tests complete)
  publish-allure-report:
    runs-on: macos-latest
    needs: [build, test]
    if: always() && needs.build.outputs.build-success == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        if: needs.test.outputs.test-results == 'success' || needs.test.outputs.test-results == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: detox-test-results-${{ github.run_id }}
        continue-on-error: true

      - name: Setup Allure
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install allure

      - name: Generate Allure report from Detox results
        run: |
          echo "Generating Allure report..."
          
          # Check if we have actual test results from tests
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f | wc -l)" -gt 0 ]; then
            echo "Found $(find allure-results -name '*.json' -type f | wc -l) test result files"
            ls -la allure-results/
            allure generate allure-results --clean -o allure-report
            echo "Allure report generated successfully with test results"
          else
            echo "No test results found, creating fallback report"
            mkdir -p allure-report
            cat > allure-report/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Detox Demo Project - Test Results</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 40px; background: #f5f7fa; }
                  .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
                  h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
                  .status { padding: 20px; border-radius: 8px; margin: 20px 0; }
                  .warning { background: #fff3cd; border-left: 4px solid #ffc107; color: #856404; }
                  .info { background: #d1ecf1; border-left: 4px solid #17a2b8; color: #0c5460; }
                  .command { background: #f8f9fa; padding: 15px; border-radius: 6px; font-family: 'Monaco', monospace; margin: 10px 0; }
                  ul { line-height: 1.6; }
                  .footer { text-align: center; color: #6c757d; margin-top: 30px; font-size: 0.9em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🧪 Detox Demo Project - Test Results</h1>
                  
                  <div class="status warning">
                      <h3>⚠️ No Test Results Available</h3>
                      <p>The Detox tests for login functionality simulation did not generate Allure-compatible results.</p>
                  </div>
                  
                  <div class="info">
                      <h3>📋 Expected Test Coverage:</h3>
                      <ul>
                          <li><strong>Login Page</strong> - Username/password input validation</li>
                          <li><strong>Secure Area</strong> - Success banner verification</li>
                          <li><strong>Error Handling</strong> - Invalid credentials testing</li>
                          <li><strong>Navigation Flow</strong> - Login to secure area transitions</li>
                      </ul>
                  </div>
                  
                  <h3>🔧 Local Testing Commands:</h3>
                  <div class="command">yarn detox:build:ios</div>
                  <div class="command">yarn detox:test:ios</div>
                  <div class="command">yarn detox:ios</div>
                  
                  <h3>📁 Test Structure:</h3>
                  <ul>
                      <li><code>e2e/pages/base-page.ts</code> - Base Page class</li>
                      <li><code>e2e/pages/login-page.ts</code> - Login screen interactions</li>
                      <li><code>e2e/pages/secure-area-page.ts</code> - Secure area validations</li>
                      <li><code>e2e/login.test.ts</code> - Login functionality tests</li>
                      <li><code>e2e/secure-area.test.ts</code> - Secure area tests</li>
                  </ul>
                  
                  <div class="footer">
                      <p>Detox Demo Project • Testing https://the-internet.herokuapp.com/login simulation</p>
                      <p>Generated: $(date)</p>
                  </div>
              </div>
          </body>
          </html>
          EOF
            echo "Fallback report created"
          fi

      - name: Upload Allure report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ios
          keep_files: true

  # Stage 4: Cleanup (Always runs)
  cleanup:
    runs-on: macos-latest
    needs: [build, test, publish-allure-report]
    if: always()
    
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning up Detox Demo Project workspace..."
          # Clean up any temporary files
          rm -rf /tmp/detox* || true
          echo "Cleanup completed"